name: Diagnose Geologic Time Scale Page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-geologic-time-scale-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Deep Time page image
        run: |
          set -euo pipefail
          url='https://beneath-our-feet.com/collections/deep-time/geologic-time-scale/?livecheck=${{ github.sha }}'
          curl -fsSL --retry 3 --retry-delay 3 "$url" -o /tmp/page.html
          echo "PUBLIC_BYTES $(wc -c </tmp/page.html)"
          if grep -q 'geologic-time-scale-corrected.webp' /tmp/page.html; then
            echo 'LIVE_CORRECTED_PANEL yes'
          else
            echo 'LIVE_CORRECTED_PANEL no'
            exit 1
          fi
