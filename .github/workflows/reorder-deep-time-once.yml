name: Reorder Deep Time Once

on:
  push:
    paths:
      - '.github/workflows/reorder-deep-time-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move Story of Earth's Deep Time to slot 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/topic-collections.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          for topic in data.get('topics', []):
              if topic.get('slug') == 'deep-time':
                  panels = topic.get('panels', [])
                  target_index = next((i for i, panel in enumerate(panels) if panel.get('filename') == 'source-123.webp'), None)
                  if target_index is None:
                      raise SystemExit('source-123.webp not found in Deep Time collection')
                  target = panels.pop(target_index)
                  panels.insert(0, target)
                  break
          else:
              raise SystemExit('Deep Time collection not found')

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/topic-collections.json
          if git diff --cached --quiet; then
            echo "Deep Time order already correct."
          else
            git commit -m "Move Story of Earth's Deep Time to slot 1"
            git push origin main
          fi
