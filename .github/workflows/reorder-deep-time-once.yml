name: Remove Deep Time Last Panel Once

on:
  push:
    paths:
      - '.github/workflows/reorder-deep-time-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-last:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Earth's Calendar from Deep Time only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('content/topic-collections.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          for topic in data.get('topics', []):
              if topic.get('slug') == 'deep-time':
                  panels = topic.get('panels', [])
                  if not panels:
                      raise SystemExit('Deep Time collection has no panels')
                  last = panels[-1]
                  if last.get('filename') != 'source-025.webp':
                      raise SystemExit(f"Unexpected last Deep Time panel: {last}")
                  panels.pop()
                  break
          else:
              raise SystemExit('Deep Time collection not found')

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/topic-collections.json
          git commit -m "Remove Earth's Calendar from Deep Time"
          git push origin main
