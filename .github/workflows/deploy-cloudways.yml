name: Deploy Theme to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudways-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy theme and purge Cloudways cache
        env:
          CLOUDWAYS_ACCESS_TOKEN: ${{ secrets.CLOUDWAYS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDWAYS_ACCESS_TOKEN:-}" ]; then
            echo "CLOUDWAYS_ACCESS_TOKEN is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          http_code=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CLOUDWAYS_ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "server_id=1476123" \
            --data-urlencode "app_id=6617325" \
            --data-urlencode "git_url=git@github.com:JoshuaTreeTours/beneath-our-feet.git" \
            --data-urlencode "branch_name=main" \
            --data-urlencode "deploy_path=wp-content/themes/beneath-our-feet/" \
            "https://api.cloudways.com/api/v2/git/pull")

          echo "Cloudways deploy HTTP status: ${http_code}"
          cat "$response_file"
          echo

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Cloudways deployment request failed."
            exit 1
          fi

          echo "Cloudways accepted the deployment request for main."
          echo "Waiting briefly for the Git pull to settle before purging page cache..."
          sleep 20

          purge_file="$(mktemp)"
          purge_code=$(curl --silent --show-error \
            --output "$purge_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${CLOUDWAYS_ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "server_id=1476123" \
            --data-urlencode "app_id=6617325" \
            "https://api.cloudways.com/api/v2/app/cache/purge")

          echo "Cloudways cache purge HTTP status: ${purge_code}"
          cat "$purge_file"
          echo

          if [ "$purge_code" -lt 200 ] || [ "$purge_code" -ge 300 ]; then
            echo "Cloudways cache purge failed."
            exit 1
          fi

          echo "Cloudways deployment and application-cache purge completed."

      - name: Identify Cenozoic archive filename
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi

          audit="$(mktemp)"
          curl --fail --silent --show-error --location \
            'https://beneath-our-feet.com/?bof_cenozoic_audit=1' > "$audit"

          python3 - "$audit" <<'PY'
          import json, os, subprocess, sys, tempfile, urllib.request

          rows = json.load(open(sys.argv[1], encoding='utf-8'))
          print(f'AUDIT_ATTACHMENT_COUNT {len(rows)}')
          matches = []
          for row in rows:
              filename = row.get('filename','')
              url = row.get('url','')
              if not filename or not url:
                  continue
              suffix = os.path.splitext(url.split('?',1)[0])[1] or '.img'
              fd, path = tempfile.mkstemp(suffix=suffix)
              os.close(fd)
              try:
                  urllib.request.urlretrieve(url, path)
                  p = subprocess.run(
                      ['tesseract', path, 'stdout'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=30,
                  )
                  text = p.stdout.upper()
                  if 'CENOZOIC' in text or ('AGE OF MAMMALS' in text and '66 MILLION' in text):
                      matches.append((filename, url, ' '.join(text.split())[:500]))
              except Exception as exc:
                  print(f'AUDIT_SKIP {filename} {type(exc).__name__}')
              finally:
                  try: os.unlink(path)
                  except OSError: pass

          for filename, url, sample in matches:
              print(f'CENOZOIC_MATCH {filename} {url}')
              print(f'CENOZOIC_OCR {sample}')
          print(f'CENOZOIC_MATCH_COUNT {len(matches)}')
          PY
