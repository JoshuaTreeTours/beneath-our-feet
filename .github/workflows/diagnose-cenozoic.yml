name: Diagnose Cenozoic Media

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Scan archive thumbnails for Cenozoic
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          curl --fail --silent --show-error --location \
            'https://beneath-our-feet.com/?bof_cenozoic_audit=1' > /tmp/audit.json
          python3 - <<'PY'
          import json, pathlib
          rows=json.load(open('/tmp/audit.json'))
          with open('/tmp/rows.tsv','w') as f:
              for r in rows:
                  if r.get('filename') and r.get('url'):
                      f.write(r['filename']+'\t'+r['url']+'\n')
          print('AUDIT_ATTACHMENT_COUNT',len(rows))
          PY
          cat /tmp/rows.tsv | xargs -P 16 -n 2 bash -c '
            fn="$0"; url="$1"; tmp="$(mktemp --suffix=.img)";
            if curl -L --fail --silent --show-error "$url" -o "$tmp"; then
              txt="$(timeout 15 tesseract "$tmp" stdout 2>/dev/null | tr "[:lower:]" "[:upper:]" || true)"
              if printf "%s" "$txt" | grep -q "CENOZOIC"; then
                echo "CENOZOIC_MATCH $fn $url"
                printf "%s" "$txt" | tr "\n" " " | cut -c1-400 | sed "s/^/CENOZOIC_OCR /"
              fi
            fi
            rm -f "$tmp"
          '
