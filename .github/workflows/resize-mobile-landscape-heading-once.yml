name: Resize Mobile Landscape Heading Once

on:
  push:
    paths:
      - '.github/workflows/resize-mobile-landscape-heading-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Slightly reduce homepage landscape heading on phones
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('style.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* Slightly smaller opening homepage headline on phones. */'
          block = '''\n\n/* Slightly smaller opening homepage headline on phones. */\n@media (max-width: 560px) {\n  body.home .bof-home-intro h2 {\n    font-size: clamp(1.85rem, 8vw, 2rem);\n    line-height: .96;\n  }\n}\n'''

          if marker not in css:
              p.write_text(css.rstrip() + block, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css

          if git diff --cached --quiet; then
            echo "Mobile heading rule already present."
          else
            git commit -m "Reduce mobile homepage landscape heading size"
            git push origin main
          fi
