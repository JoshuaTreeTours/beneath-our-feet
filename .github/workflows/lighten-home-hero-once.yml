name: Lighten Home Hero Once

on:
  push:
    paths:
      - '.github/workflows/lighten-home-hero-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove desktop hero dimming and brighten image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          s = s.replace('filter: brightness(1.16) !important;', 'filter: brightness(1.35) !important;')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "Hero brightness already at requested level."
          else
            git commit -m "Brighten desktop homepage hero further"
            git push origin main
          fi
